<style>
/* Cópia literal de docs/design/tokens/tokens.css (não edite aqui; edite a fonte). */
/* =========================================================================
   MyFinance — tokens da direção B (calorosa). Fonte da verdade; contrato de tema em docs/design/tokens/tokens.md.
   3 camadas: primitivos -> semânticos -> componente.
   Componentes só usam as camadas 2 e 3. Contraste verificado por contraste.mjs.
   Convenção do arquivo (o script depende dela): blocos :root sem indentação.
   Tema: segue o sistema (prefers-color-scheme); override manual opcional via
   <html data-theme="light|dark">. O bloco dark aparece 2x (media + atributo):
   contraste.mjs falha se divergirem.
   ========================================================================= */

/* ---------- CAMADA 1 · PRIMITIVOS ---------- */
:root {
  /* neutros quentes */
  --cream-0:#FFFFFF; --cream-25:#FFFBF6; --cream-50:#FFF6EC; --cream-100:#F8EBDC; --cream-200:#EBDAC7; --cream-300:#D5BFA8;
  --brown-400:#9A8573; --brown-500:#7A6757; --brown-600:#5E4D40; --brown-800:#3A2D24; --brown-900:#2A1F18;
  --night-900:#17110D; --night-850:#1E1713; --night-800:#271E18; --night-700:#34291F; --night-600:#43362B; --night-300:#A99886; --night-100:#EFE3D6;
  /* marca damasco */
  --apricot-50:#FFEEDF; --apricot-200:#FFC99B; --apricot-400:#F5893F; --apricot-600:#BF4E14; --apricot-700:#9E3F0D;
  /* semântica financeira (sem vermelho puro) */
  --green-50:#E3F5EA; --green-600:#1B7A4B; --green-300:#6FD6A0;
  --plum-50:#F9E6F0; --plum-600:#9A3A66; --plum-300:#F0A3C6;
  --indigo-50:#E8EAFB; --indigo-600:#4452B5; --indigo-300:#AEB8FF;
  --amber-50:#FFEBD0; --amber-700:#A44A06; --amber-300:#FFB877;

  /* categorias: Okabe-Ito estendida, 10 cores + glifo próprio (cor nunca é o único canal) */
  --cat-1:#0072B2; --cat-2:#BD8300; --cat-3:#009E73; --cat-4:#C972A2; --cat-5:#1D96DB;
  --cat-6:#D55E00; --cat-7:#9C920C; --cat-8:#7A5195; --cat-9:#8C6D31; --cat-10:#5B6770;
  --cat-1-ink:var(--cat-ink-light); --cat-2-ink:var(--cat-ink-dark); --cat-3-ink:var(--cat-ink-dark); --cat-4-ink:var(--cat-ink-dark); --cat-5-ink:var(--cat-ink-dark); --cat-6-ink:var(--cat-ink-dark); --cat-7-ink:var(--cat-ink-dark); --cat-8-ink:var(--cat-ink-light); --cat-9-ink:var(--cat-ink-light); --cat-10-ink:var(--cat-ink-light);
  --cat-ink-dark:#2A1F18; --cat-ink-light:#FFFFFF; /* glifo sobre a cor */

  /* espaçamento (grade 4px) */
  --space-0:0; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;

  /* raio */
  --radius-1:12px; --radius-2:18px; --radius-3:24px; --radius-4:32px; --radius-pill:999px;

  /* tipografia */
  --font-display:'Fredoka Variable','Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --font-text:'Nunito Variable','Nunito',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --fs-1:12px; --fs-2:14px; --fs-3:16px; --fs-4:20px; --fs-5:26px; --fs-6:34px; /* escala ~x1.25 */
  --fw-medium:500; --fw-bold:700; --fw-heavy:800; --fw-display:600;
  --lh-tight:1.15; --lh-snug:1.3; --lh-body:1.45;
  --ls-tight:-0.01em;

  /* borda */
  --bw-1:1px; --bw-2:2px;

  /* movimento */
  --dur-fast:150ms; --dur-base:200ms; --dur-slow:300ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.4,0,.2,1);

  /* z-index nomeados */
  --z-base:0; --z-sticky:10; --z-tabbar:20; --z-sheet:30; --z-dialog:40; --z-toast:50;

  /* alvo de toque mínimo */
  --tap:44px;
}

/* ---------- CAMADA 2 · SEMÂNTICOS · claro (padrão) ---------- */
:root {
  color-scheme: light;
  --surface-page:var(--cream-50);
  --surface-raised:var(--cream-0);
  --surface-sunken:var(--cream-100);
  --surface-overlay:rgba(42,31,24,.45);
  --border-subtle:var(--cream-200);
  --border-strong:var(--cream-300);
  --text-strong:var(--brown-900);
  --text-body:var(--brown-800);
  --text-muted:var(--brown-500);
  --brand:var(--apricot-600);
  --brand-soft:var(--apricot-50);
  --brand-strong:var(--apricot-700);
  --on-brand:#FFFFFF;
  --focus-ring:var(--indigo-600);

  /* financeiro. Status nunca só por cor: sempre sinal/ícone/rótulo. */
  --color-income:var(--green-600);    --color-income-soft:var(--green-50);
  --color-expense:var(--plum-600);    --color-expense-soft:var(--plum-50);
  --color-transfer:var(--brown-600);  --color-transfer-soft:var(--cream-100);
  --color-forecast:var(--indigo-600); --color-forecast-soft:var(--indigo-50);
  --color-overdue:var(--amber-700);   --color-overdue-soft:var(--amber-50);
  --color-pending:var(--brown-500);   --color-pending-soft:var(--cream-100);
  --color-settled:var(--green-600);   --color-settled-soft:var(--green-50);

  --shadow-soft:0 6px 18px rgba(94,60,30,.10);
  --shadow-lift:0 14px 36px rgba(94,60,30,.18);
}

/* ---------- CAMADA 2 · SEMÂNTICOS · escuro ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-page:var(--night-900);
    --surface-raised:var(--night-800);
    --surface-sunken:var(--night-850);
    --surface-overlay:rgba(0,0,0,.6);
    --border-subtle:var(--night-600);
    --border-strong:var(--night-300);
    --text-strong:#FFF5EA;
    --text-body:var(--night-100);
    --text-muted:var(--night-300);
    --brand:var(--apricot-400);
    --brand-soft:#3A2415;
    --brand-strong:var(--apricot-400);
    --cat-1:#0072B2; --cat-2:#E69F00; --cat-3:#009E73; --cat-4:#CC79A7; --cat-5:#56B4E9;
    --cat-6:#D55E00; --cat-7:#F0E442; --cat-8:#8558A2; --cat-9:#8C6D31; --cat-10:#606C76;
    --cat-1-ink:var(--cat-ink-light); --cat-2-ink:var(--cat-ink-dark); --cat-3-ink:var(--cat-ink-dark); --cat-4-ink:var(--cat-ink-dark); --cat-5-ink:var(--cat-ink-dark); --cat-6-ink:var(--cat-ink-dark); --cat-7-ink:var(--cat-ink-dark); --cat-8-ink:var(--cat-ink-light); --cat-9-ink:var(--cat-ink-light); --cat-10-ink:var(--cat-ink-light);
    --on-brand:var(--brown-900);
    --focus-ring:var(--indigo-300);
    --color-income:var(--green-300);    --color-income-soft:#17301F;
    --color-expense:var(--plum-300);    --color-expense-soft:#3A1F2D;
    --color-transfer:var(--night-100);  --color-transfer-soft:var(--night-700);
    --color-forecast:var(--indigo-300); --color-forecast-soft:#1F2442;
    --color-overdue:var(--amber-300);   --color-overdue-soft:#3B2512;
    --color-pending:var(--night-300);   --color-pending-soft:var(--night-700);
    --color-settled:var(--green-300);   --color-settled-soft:#17301F;
    --shadow-soft:0 6px 18px rgba(0,0,0,.35);
    --shadow-lift:0 14px 36px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-page:var(--night-900);
  --surface-raised:var(--night-800);
  --surface-sunken:var(--night-850);
  --surface-overlay:rgba(0,0,0,.6);
  --border-subtle:var(--night-600);
  --border-strong:var(--night-300);
  --text-strong:#FFF5EA;
  --text-body:var(--night-100);
  --text-muted:var(--night-300);
  --brand:var(--apricot-400);
  --brand-soft:#3A2415;
  --brand-strong:var(--apricot-400);
  --cat-1:#0072B2; --cat-2:#E69F00; --cat-3:#009E73; --cat-4:#CC79A7; --cat-5:#56B4E9;
  --cat-6:#D55E00; --cat-7:#F0E442; --cat-8:#8558A2; --cat-9:#8C6D31; --cat-10:#606C76;
  --cat-1-ink:var(--cat-ink-light); --cat-2-ink:var(--cat-ink-dark); --cat-3-ink:var(--cat-ink-dark); --cat-4-ink:var(--cat-ink-dark); --cat-5-ink:var(--cat-ink-dark); --cat-6-ink:var(--cat-ink-dark); --cat-7-ink:var(--cat-ink-dark); --cat-8-ink:var(--cat-ink-light); --cat-9-ink:var(--cat-ink-light); --cat-10-ink:var(--cat-ink-light);
  --on-brand:var(--brown-900);
  --focus-ring:var(--indigo-300);
  --color-income:var(--green-300);    --color-income-soft:#17301F;
  --color-expense:var(--plum-300);    --color-expense-soft:#3A1F2D;
  --color-transfer:var(--night-100);  --color-transfer-soft:var(--night-700);
  --color-forecast:var(--indigo-300); --color-forecast-soft:#1F2442;
  --color-overdue:var(--amber-300);   --color-overdue-soft:#3B2512;
  --color-pending:var(--night-300);   --color-pending-soft:var(--night-700);
  --color-settled:var(--green-300);   --color-settled-soft:#17301F;
  --shadow-soft:0 6px 18px rgba(0,0,0,.35);
  --shadow-lift:0 14px 36px rgba(0,0,0,.5);
}

/* ---------- MODO DALTONISMO · <html data-cvd="on"> · combina com claro/escuro ----------
   Sobrescreve só tokens semânticos/categoria. Receita=azul, despesa=laranja (eixo azul-laranja,
   seguro p/ protan/deutan) em vez de verde-vermelho; categorias separadas por luminância+matiz
   (ΔE2000 >= 15 nas simulações, medido por contraste.mjs). Glifo/sinal/rótulo continuam obrigatórios. */
:root[data-cvd="on"] {
  --cat-1:#4B5016; --cat-2:#2D757D; --cat-3:#22A08D; --cat-4:#144752; --cat-5:#4A1C21;
  --cat-6:#A18F29; --cat-7:#141254; --cat-8:#BF364B; --cat-9:#D02FCD; --cat-10:#5C22A0;
  --cat-1-ink:var(--cat-ink-light); --cat-2-ink:var(--cat-ink-light); --cat-3-ink:var(--cat-ink-dark); --cat-4-ink:var(--cat-ink-light); --cat-5-ink:var(--cat-ink-light); --cat-6-ink:var(--cat-ink-dark); --cat-7-ink:var(--cat-ink-light); --cat-8-ink:var(--cat-ink-light); --cat-9-ink:var(--cat-ink-light); --cat-10-ink:var(--cat-ink-light);
  --color-income:#0A6BA3;   --color-income-soft:#E2EDF4;
  --color-expense:#6D1503;  --color-expense-soft:#EDE3E1;
  --color-forecast:#480F61; --color-forecast-soft:#E9E2EC;
  --color-overdue:#886003;  --color-overdue-soft:#F1ECE1;
  --color-pending:#6C675C;  --color-pending-soft:#EDEDEB;
  --color-transfer:#393939; --color-transfer-soft:#E7E7E7;
  --color-settled:#0A6BA3;  --color-settled-soft:#E2EDF4;
}
@media (prefers-color-scheme: dark) {
  :root[data-cvd="on"]:not([data-theme="light"]) {
    --color-income:#A2CEFD;   --color-income-soft:#363333;
    --color-expense:#FA6B42;  --color-expense-soft:#40271D;
    --color-forecast:#9E83F1; --color-forecast-soft:#352A32;
    --color-overdue:#F9DB93;  --color-overdue-soft:#403527;
    --color-pending:#D1D1D1;  --color-pending-soft:#3B332E;
    --color-transfer:#B19B8B; --color-transfer-soft:#382D26;
    --color-settled:#A2CEFD;  --color-settled-soft:#363333;
    --cat-1:#9F4C89; --cat-2:#ACE4EC; --cat-3:#A1B035; --cat-4:#7567DF; --cat-5:#BF7BA3;
    --cat-6:#4B9B70; --cat-7:#A6A8EC; --cat-8:#D02C2E; --cat-9:#E3E78E; --cat-10:#E7B9B1;
    --cat-1-ink:var(--cat-ink-light); --cat-2-ink:var(--cat-ink-dark); --cat-3-ink:var(--cat-ink-dark); --cat-4-ink:var(--cat-ink-light); --cat-5-ink:var(--cat-ink-dark); --cat-6-ink:var(--cat-ink-dark); --cat-7-ink:var(--cat-ink-dark); --cat-8-ink:var(--cat-ink-light); --cat-9-ink:var(--cat-ink-dark); --cat-10-ink:var(--cat-ink-dark);
  }
}
:root[data-cvd="on"][data-theme="dark"] {
  --color-income:#A2CEFD;   --color-income-soft:#363333;
  --color-expense:#FA6B42;  --color-expense-soft:#40271D;
  --color-forecast:#9E83F1; --color-forecast-soft:#352A32;
  --color-overdue:#F9DB93;  --color-overdue-soft:#403527;
  --color-pending:#D1D1D1;  --color-pending-soft:#3B332E;
  --color-transfer:#B19B8B; --color-transfer-soft:#382D26;
  --color-settled:#A2CEFD;  --color-settled-soft:#363333;
  --cat-1:#9F4C89; --cat-2:#ACE4EC; --cat-3:#A1B035; --cat-4:#7567DF; --cat-5:#BF7BA3;
  --cat-6:#4B9B70; --cat-7:#A6A8EC; --cat-8:#D02C2E; --cat-9:#E3E78E; --cat-10:#E7B9B1;
  --cat-1-ink:var(--cat-ink-light); --cat-2-ink:var(--cat-ink-dark); --cat-3-ink:var(--cat-ink-dark); --cat-4-ink:var(--cat-ink-light); --cat-5-ink:var(--cat-ink-dark); --cat-6-ink:var(--cat-ink-dark); --cat-7-ink:var(--cat-ink-dark); --cat-8-ink:var(--cat-ink-light); --cat-9-ink:var(--cat-ink-dark); --cat-10-ink:var(--cat-ink-dark);
}

/* ---------- CAMADA 2 · tipografia semântica (valor monetário) ---------- */
:root {
  --num-features:tabular-nums lining-nums;
  /* grande: hero e sheet (Fredoka) */
  --money-lg-font:var(--font-display); --money-lg-size:var(--fs-6); --money-lg-weight:var(--fw-display); --money-lg-lh:var(--lh-tight);
  /* médio: cartões/resumos (Nunito 800) */
  --money-md-font:var(--font-text); --money-md-size:var(--fs-4); --money-md-weight:var(--fw-heavy); --money-md-lh:var(--lh-snug);
  /* pequeno: linhas de lista */
  --money-sm-font:var(--font-text); --money-sm-size:var(--fs-3); --money-sm-weight:var(--fw-heavy); --money-sm-lh:var(--lh-snug);
  /* positivo/negativo: a cor vem de --color-income / --color-expense; o sinal (+/−) é obrigatório no texto */
  --money-positive:var(--color-income);
  --money-negative:var(--color-expense);
}

/* ---------- CAMADA 3 · COMPONENTE ---------- */
:root {
  --btn-radius:var(--radius-pill); --btn-h:var(--tap); --btn-px:var(--space-5);
  --btn-primary-bg:var(--brand); --btn-primary-fg:var(--on-brand);
  --btn-quiet-bg:var(--brand-soft); --btn-quiet-fg:var(--text-strong);
  --card-bg:var(--surface-raised); --card-radius:var(--radius-3); --card-pad:var(--space-5); --card-shadow:var(--shadow-soft);
  --row-gap:var(--space-3); --row-pad:var(--space-3); --row-icon:44px; --row-min-h:var(--tap);
  --tabbar-bg:var(--surface-raised); --tabbar-active-bg:var(--brand-soft); --tabbar-active-fg:var(--brand-strong);
  --sheet-radius:var(--radius-4); --sheet-z:var(--z-sheet);
  --field-bg:var(--surface-sunken); --field-radius:var(--radius-2); --field-h:var(--tap);
  --chip-radius:var(--radius-pill);
  --tabbar-h:calc(var(--tap) + var(--space-3)); --menu-w:208px; --toast-bg:var(--text-strong); --toast-fg:var(--surface-page);
}

/* ---------- Movimento reduzido: durações viram ~0 ---------- */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast:0.01ms; --dur-base:0.01ms; --dur-slow:0.01ms; }
}
</style>
<style>
/* ---------- Página do protótipo (fora do celular) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--surface-sunken); color: var(--text-body); font: var(--fw-medium) var(--fs-3)/var(--lh-body) var(--font-text); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: var(--bw-2) solid var(--focus-ring); outline-offset: var(--bw-2); }
h1, h2, h3, p { margin: 0; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.stage { display: flex; flex-wrap: wrap; gap: var(--space-8); justify-content: center; align-items: flex-start; padding: var(--space-6) var(--space-4); }
.panel { width: 340px; max-width: 100%; display: grid; gap: var(--space-5); }
.panel h1 { font: var(--fw-display) var(--fs-5)/var(--lh-tight) var(--font-display); color: var(--text-strong); }
.panel h2 { font: var(--fw-heavy) var(--fs-1)/var(--lh-tight) var(--font-text); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--space-2); }
.panel .small, .small { font-size: var(--fs-2); color: var(--text-muted); }
.opts { display: grid; gap: var(--space-2); }
.opt { text-align: left; background: var(--surface-raised); border: var(--bw-2) solid var(--border-subtle); border-radius: var(--radius-2); padding: var(--space-3); display: grid; gap: var(--space-1); min-height: var(--tap); }
.opt b { color: var(--text-strong); display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.opt span { font-size: var(--fs-2); color: var(--text-muted); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.proscons { background: var(--surface-raised); border-radius: var(--radius-2); padding: var(--space-3); font-size: var(--fs-2); display: grid; gap: var(--space-1); }
.proscons p::before { font-weight: var(--fw-heavy); margin-right: var(--space-2); }
.proscons .pro::before { content: '+'; color: var(--color-income); }
.proscons .con::before { content: '−'; color: var(--color-expense); }
.panel ul { margin: 0; padding-left: var(--space-5); font-size: var(--fs-2); display: grid; gap: var(--space-1); }

/* ---------- Moldura ---------- */
.phone { width: 390px; max-width: 100%; height: 844px; max-height: calc(100vh - var(--space-8)); min-height: 560px; background: var(--surface-page); border: var(--space-2) solid var(--text-strong); border-radius: 44px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-lift); }
.hdr { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-2); min-height: calc(var(--tap) + var(--space-4)); }
.hdr h2 { font: var(--fw-display) var(--fs-5)/var(--lh-tight) var(--font-display); color: var(--text-strong); letter-spacing: var(--ls-tight); }
.iconbtn { width: var(--tap); height: var(--tap); border: 0; background: transparent; border-radius: var(--radius-pill); display: grid; place-items: center; color: var(--text-strong); flex: none; }
.iconbtn:hover { background: var(--surface-sunken); }
.screen { flex: 1; overflow-y: auto; padding: var(--space-2) var(--space-4) calc(var(--tap) + var(--space-10)); display: flex; flex-direction: column; gap: var(--space-4); }
.tabbar { display: flex; background: var(--tabbar-bg); border-top: var(--bw-1) solid var(--border-subtle); padding: var(--space-1) var(--space-2); min-height: var(--tabbar-h); }
.tabbar button { flex: 1; min-height: var(--tap); border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); font: var(--fw-bold) var(--fs-1)/var(--lh-tight) var(--font-text); color: var(--text-muted); }
.tabbar .pill { display: grid; place-items: center; width: var(--space-12); height: var(--space-8); border-radius: var(--radius-2); }
.tabbar .on { color: var(--tabbar-active-fg); }
.tabbar .on .pill { background: var(--tabbar-active-bg); }

/* ---------- Componentes (espelham frontend/src/ui) ---------- */
.subtabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: var(--bw-1) solid var(--border-subtle); }
.subtabs button { border: 0; background: transparent; min-height: var(--tap); font: var(--fw-bold) var(--fs-3) var(--font-text); color: var(--text-muted); border-bottom: var(--bw-2) solid transparent; }
.subtabs button[aria-pressed="true"] { color: var(--brand-strong); border-bottom-color: var(--brand-strong); }
.fab { position: absolute; right: var(--space-4); bottom: calc(var(--tabbar-h) + var(--space-5)); z-index: var(--z-sticky); box-shadow: var(--shadow-lift); }
.nextv { border: var(--bw-1) dashed var(--color-forecast); border-radius: var(--radius-2); padding: var(--space-3); display: grid; gap: var(--space-3); justify-items: start; }
.nextv > .field, .nextv > .btn { width: 100%; }

<script>
/* Registro de design: dados falsos, regras calculadas na hora. Espelha a tela implementada (frontend/src/Recurrences.svelte,
   RecurrenceSheet.svelte, subaba em Month.svelte). Onde divergir, a implementação vence. Nada aqui vira código de produção. */
const TODAY = '2026-11-27';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ICONS = {
  home: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', wallet: 'M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h.01',
  tag: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01', sliders: 'M4 6h16M4 12h16M4 18h16M15 4v4M8 10v4M13 16v4',
  repeat: 'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3', clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',
  chev: 'M9 6l6 6-6 6', back: 'M15 6l-6 6 6 6', plus: 'M12 5v14M5 12h14', check: 'M5 12l5 5 9-10', down: 'M12 5v14M6 13l6 6 6-6',
  more: 'M5 12h.01M12 12h.01M19 12h.01', x: 'M6 6l12 12M18 6L6 18', alert: 'M12 4l9 16H3zM12 10v4M12 17h.01',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;

/* ---------- datas (UTC, ISO) ---------- */
const D = (s) => new Date(s + 'T00:00:00Z');
const iso = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = D(s), day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); d.setUTCDate(Math.min(day, new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate())); return iso(d); };
const HORIZON = addMonths(TODAY, 12); // o app gera 12 meses à frente
const shortDate = (s) => s.slice(8, 10) + '/' + s.slice(5, 7);
const fullDate = (s) => s.split('-').reverse().join('/');
const fmtMoney = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const WEEKDAYS = ['aos domingos', 'às segundas', 'às terças', 'às quartas', 'às quintas', 'às sextas', 'aos sábados'];
const FREQS = [['monthly', 'Todo mês'], ['weekly', 'Toda semana'], ['yearly', 'Todo ano'], ['daily', 'Todo dia']];
const UNITS = { daily: 'dias', weekly: 'semanas', monthly: 'meses', yearly: 'anos' };

/* ---------- dados de exemplo ---------- */
const ACCOUNTS = { itau: ['Itaú'], nubank: ['Nubank'], carteira: ['Carteira'], antigo: ['Banco antigo', true] }; // [nome, arquivada]
const accName = (id) => ACCOUNTS[id][0] + (ACCOUNTS[id][1] ? ' (arquivada)' : '');
const CATS = { moradia: ['Moradia', 1], casa: ['Casa', 5], saude: ['Saúde', 3], transporte: ['Transporte', 6], lazer: ['Lazer', 8], estudo: ['Estudo', 2], trabalho: ['Trabalho', 9], '': ['Sem categoria', 0] };
const seed = () => [
  { id: 'r1', kind: 'expense', description: 'Aluguel', amount_cents: 180000, account_id: 'itau', category_id: 'moradia', frequency: 'monthly', interval_n: 1, start_date: '2026-03-05', end_date: null, active: true, late: [] },
  { id: 'r2', kind: 'expense', description: 'Condomínio', amount_cents: 42000, account_id: 'itau', category_id: 'moradia', frequency: 'monthly', interval_n: 1, start_date: '2026-04-20', end_date: null, active: true, late: ['2026-11-20'] },
  { id: 'r3', kind: 'expense', description: 'Academia', amount_cents: 11990, account_id: 'nubank', category_id: 'saude', frequency: 'monthly', interval_n: 1, start_date: '2026-06-10', end_date: '2027-05-10', active: true, late: [] },
  { id: 'r4', kind: 'expense', description: 'Faxina', amount_cents: 18000, account_id: 'carteira', category_id: 'casa', frequency: 'weekly', interval_n: 2, start_date: '2026-09-04', end_date: null, active: true, late: [] },
  { id: 'r5', kind: 'expense', description: 'Internet', amount_cents: 9990, account_id: 'nubank', category_id: 'casa', frequency: 'monthly', interval_n: 1, start_date: '2026-01-15', end_date: null, active: true, late: [] },
  { id: 'r6', kind: 'expense', description: 'Seguro do carro', amount_cents: 142000, account_id: 'itau', category_id: 'transporte', frequency: 'yearly', interval_n: 1, start_date: '2026-02-20', end_date: null, active: true, late: [] },
  { id: 'r7', kind: 'income', description: 'Salário', amount_cents: 650000, account_id: 'itau', category_id: 'trabalho', frequency: 'monthly', interval_n: 1, start_date: '2026-01-05', end_date: null, active: true, late: [] },
  { id: 'r8', kind: 'income', description: 'Aluguel da vaga de garagem', amount_cents: 25000, account_id: 'nubank', category_id: '', frequency: 'monthly', interval_n: 1, start_date: '2026-07-01', end_date: null, active: true, late: [] },
  { id: 'r9', kind: 'expense', description: 'Streaming de filmes', amount_cents: 3990, account_id: 'nubank', category_id: 'lazer', frequency: 'monthly', interval_n: 1, start_date: '2025-08-12', end_date: '2026-09-12', active: true, late: [] },
  { id: 'r10', kind: 'expense', description: 'Curso de inglês', amount_cents: 28000, account_id: 'nubank', category_id: 'estudo', frequency: 'monthly', interval_n: 1, start_date: '2026-05-03', end_date: '2026-10-03', active: false, late: [] },
  { id: 'r11', kind: 'expense', description: 'Plano de celular', amount_cents: 5990, account_id: 'antigo', category_id: 'casa', frequency: 'monthly', interval_n: 1, start_date: '2026-02-18', end_date: null, active: true, late: [] },
];

/* ---------- regra -> lançamentos ---------- */
const stepDate = (r, i) => r.frequency === 'daily' ? addDays(r.start_date, i * r.interval_n) : r.frequency === 'weekly' ? addDays(r.start_date, 7 * i * r.interval_n) : addMonths(r.start_date, (r.frequency === 'yearly' ? 12 : 1) * i * r.interval_n);
function occurrences(r, until = HORIZON, ignoreEnd = false) {
  const out = [];
  for (let i = 0; ; i++) { const d = stepDate(r, i); if (d > until || (!ignoreEnd && r.end_date && d > r.end_date)) break; out.push(d); }
  return out;
}
// pending: de hoje em diante; late: pendentes com data < hoje (atrasados)
function stats(r) {
  const all = occurrences(r);
  return { paid: all.filter((d) => d < TODAY && !r.late.includes(d)), late: all.filter((d) => d < TODAY && r.late.includes(d)), pending: all.filter((d) => d >= TODAY) };
}
// encerrada: desativada, com data final no passado, ou com data final e nada mais por vir (igual a recurrenceView)
const stateOf = (r) => !r.active || (r.end_date && (r.end_date < TODAY || !stats(r).pending.length)) ? 'ended' : r.end_date ? 'ending' : 'active';
function rhythm(r) {
  const n = r.interval_n, d = D(r.start_date);
  const [one, when] = { daily: ['Todo dia', ''], weekly: ['Toda semana', WEEKDAYS[d.getUTCDay()]], monthly: ['Todo mês', `dia ${d.getUTCDate()}`], yearly: ['Todo ano', `em ${shortDate(r.start_date)}`] }[r.frequency];
  return (n === 1 ? one : `A cada ${n} ${UNITS[r.frequency]}`) + (when && `, ${when}`);
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- estado ---------- */
const HOME = { A: 'month', B: 'more', C: 'accounts' };
const hash = new URLSearchParams(location.hash.slice(1));
const SELFTEST = hash.has('selftest');
const data = { full: seed(), empty: [] };
const S = {
  place: hash.get('place') || 'A', tab: hash.get('tab') || 'month', sub: hash.get('sub') || 'rep', data: hash.get('data') || 'full',
  theme: hash.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), next: hash.get('v') === 'next',
  sheet: hash.get('sheet'), confirm: hash.has('confirm'), menu: null, toast: null, error: {}, seq: 0,
};
const rules = () => data[S.data];
const rule = (id) => rules().find((r) => r.id === id);
const NEXTV = '<span class="badge forecast">Próxima versão</span>';

/* ---------- painel de fora ---------- */
const PLACES = {
  A: ['Mês › Repetições', 'Subaba no topo da aba Mês: “Lançamentos | Repetições”.', ['É onde a pessoa já lança e vê “repete” nas linhas: 1 toque a partir da tela inicial.', 'Criar continua no mesmo lugar (Lançar › Repetir).'], ['A aba Mês ganha um segundo seletor, além do filtro Todos/Pendentes/Efetivados.']],
  B: ['Mais › Repetições', 'Uma linha na aba Mais abre a tela, com “voltar”.', ['Não mexe nas telas do dia a dia.'], ['Fica escondido: Mais é ajuste (tema, sincronização, conta). 2 toques, e ninguém procura o aluguel em “Mais”.']],
  C: ['Contas › Repetições', 'Subaba no topo da aba Contas: “Contas | Repetições”.', ['A aba Contas é curta: a subaba não disputa espaço.'], ['Confunde “Contas” (banco, carteira) com “contas a pagar”. A repetição é de lançamento, não de conta bancária.']],
};
const seg = (act, label, cur, opts) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([v, t]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${t}</button>`).join('')}</div>`;
function panelHTML() {
  const [, , pros, cons] = PLACES[S.place];
  return `
  <div><h1>Repetições</h1><p class="small">Registro de design da issue #23 · decidido em 27/11/2026 e implementado na aba Mês · hoje no protótipo: ${fullDate(TODAY)}</p></div>

  </div></div>
  ${S.place === 'A' ? '' : '<p class="hist" id="hist">Histórico: alternativa não escolhida. A tela foi implementada na alternativa A.</p>'}
  <div class="proscons">${pros.map((p) => `<p class="pro">${p}</p>`).join('')}${cons.map((p) => `<p class="con">${p}</p>`).join('')}</div>
  <div><h2>Versão</h2>${seg('ver', 'Versão', S.next ? 'next' : 'now', [['now', 'Atual'], ['next', 'Próxima versão']])}
    <p class="small" style="margin-top:var(--space-2)">“Próxima versão” mostra o que já foi decidido e ainda não foi implementado: mudar o ritmo e o dia na própria tela, e “Repetir de novo” numa encerrada.</p></div>
  <div><h2>Dados de exemplo</h2>${seg('data', 'Dados de exemplo', S.data, [['full', 'Com repetições'], ['empty', 'Vazio']])}</div>
  <div><h2>Tema</h2>${seg('theme', 'Tema', S.theme, [['light', 'Claro'], ['dark', 'Escuro']])}</div>

function ruleRow(r) {

function repList() {
  const all = rules();

  const first = (r) => { const s = stats(r); return s.late[0] ?? s.pending[0] ?? '9'; }; // atrasado primeiro, depois o que vence antes
  const sorted = [...all].sort((a, b) => first(a).localeCompare(first(b)) || a.description.localeCompare(b.description, 'pt-BR'));
  // Encerrada com atrasado fica na lista principal: ainda há o que efetivar ou excluir.
  const gone = (r) => stateOf(r) === 'ended' && !stats(r).late.length, ended = sorted.filter(gone);
  // Resumo: pendentes de hoje a hoje + 29, sem as contas arquivadas (como na aba Mês).
  const until = addDays(TODAY, 30);
  const sum = (k) => all.filter((r) => r.kind === k && !ACCOUNTS[r.account_id][1]).reduce((a, r) => a + stats(r).pending.filter((d) => d < until).length * r.amount_cents, 0);
  const inc = sum('income'), exp = sum('expense');
  const group = (k, title) => { const g = sorted.filter((r) => r.kind === k && !gone(r)); return g.length ? `<section><div class="grouphead"><b>${title}</b><span>${g.length}</span></div><div class="list" role="list">${g.map(ruleRow).join('')}</div></section>` : ''; };
  return `
  <div class="card" id="summary"><p class="cap">Próximos 30 dias</p><div class="tot">
    <div class="stat"><span>A receber</span><b class="income">${signed(inc, 'income')}</b></div>
    <div class="stat"><span>A pagar</span><b class="expense">${signed(exp, 'expense')}</b></div>
    <div class="stat"><span>Resultado</span><b>${inc - exp < 0 ? '−' : ''}${fmtMoney(Math.abs(inc - exp))}</b></div></div></div>
  <div class="sech">Contas que se repetem</div>
  ${group('expense', 'A pagar')}${group('income', 'A receber')}

}

/* ---------- detalhe / edição ---------- */
const opt = (entries, cur) => entries.map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('');
const accOpts = (cur) => Object.entries(ACCOUNTS).filter(([k, v]) => !v[1] || k === cur).map(([k]) => [k, ACCOUNTS[k][0]]);

    <nav class="tabbar" aria-label="Seções">${TABS.map(([k, t, i]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}" ${S.tab === k ? 'aria-current="page"' : ''}><span class="pill">${ic(i)}</span>${t}</button>`).join('')}</nav>
    ${S.sheet ? sheetHTML() : ''}${S.sheet && S.confirm ? confirmHTML() : ''}

  if (!SELFTEST) history.replaceState(null, '', '#' + new URLSearchParams({ place: S.place, tab: S.tab, sub: S.sub, data: S.data, theme: S.theme, v: S.next ? 'next' : 'now' }));
}
let toastTimer;
function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 4000); }
const parseMoney = (v) => Math.round(Number(String(v).trim().replace(/\./g, '').replace(',', '.')) * 100);

// Como editRule: mudam a regra e os pendentes com data >= `from`. Se sobram pendentes antes de `from`, a repetição se divide
// em duas (a antiga termina na véspera). `rh` (próxima versão): ritmo/dia novos; com efetivados para trás, também divide.
function editRule(r, from, patch, rh) {
  const s = stats(r), mine = [...s.late, ...s.pending], tx = mine.find((d) => d >= from) ?? mine.at(-1);
  const turn = rh && (rh.frequency !== r.frequency || rh.interval_n !== r.interval_n || (rh.day && rh.day !== tx)) ? { frequency: rh.frequency, interval_n: rh.interval_n, start_date: rh.day || tx || r.start_date } : null;
  if (!tx || (tx === mine[0] && !(turn && s.paid.length))) return Object.assign(r, patch, turn);
  rules().push({ ...r, ...patch, id: 'n' + ++S.seq, start_date: tx, late: r.late.filter((d) => d >= tx), ...turn });
  r.end_date = addDays(tx, -1);
}
function save() {
  const f = Object.fromEntries(new FormData($('#form'))), cents = parseMoney(f.amount), n = Math.max(1, Number(f.interval_n) || 1);
  S.error = {};
  if (!(cents > 0)) S.error.amount = 'Informe um valor maior que zero.';
  else if (!f.description.trim()) S.error.description = 'Informe a descrição.';
  if (Object.keys(S.error).length) return render();
  const patch = { description: f.description.trim(), amount_cents: cents, account_id: f.account_id, category_id: f.category_id };
  if (S.sheet === 'new') rules().push({ id: 'n' + ++S.seq, kind: f.kind, frequency: f.frequency, interval_n: n, start_date: f.start_date || TODAY, end_date: f.end_date || null, active: true, late: [], ...patch });
  else editRule(rule(S.sheet), f.from || TODAY, patch, f.frequency && { frequency: f.frequency, interval_n: n, day: f.day });
  S.sheet = null; render();
}
const ACT = {
  place: (v) => { Object.assign(S, { place: v, tab: HOME[v], sub: v === 'B' ? 'main' : 'rep', sheet: null, confirm: false, menu: null }); },
  data: (v) => { Object.assign(S, { data: v, sheet: null, confirm: false }); },
  theme: (v) => { S.theme = v; },
  ver: (v) => { Object.assign(S, { next: v === 'next', sheet: null, confirm: false }); },
  tab: (v) => { Object.assign(S, { tab: v, sub: 'main', menu: null }); },
  sub: (v) => { S.sub = v; S.menu = null; },
  open: (v) => { S.sheet = v; S.error = {}; },
  new: () => { S.sheet = 'new'; S.error = {}; },
  see: (v) => { S.sheet = v; S.menu = null; S.error = {}; },
  menu: (v) => { S.menu = S.menu === v ? null : v; },
  close: () => { S.sheet = null; S.confirm = false; },
  end: () => { S.confirm = true; },
  'end-no': () => { S.confirm = false; },
  // Como endRecurrence: data final = ontem (nunca antes do início nem depois de uma data final que já existia) e desativa.
  'end-yes': () => { const r = rule(S.sheet), last = addDays(TODAY, -1); Object.assign(r, { active: false, end_date: [r.start_date, r.end_date && r.end_date < last ? r.end_date : last].sort().at(-1) }); S.sheet = null; S.confirm = false; },
  again: () => { const r = rule(S.sheet), start = occurrences(r, HORIZON, true).find((d) => d >= TODAY) ?? TODAY; rules().push({ ...r, id: 'n' + ++S.seq, start_date: start, end_date: null, active: true, late: [] }); S.sheet = null; },
  kind: (v, el) => { el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === el)); $('#form [name=kind]').value = v; return false; },
  nop: () => { S.menu = null; toast('Fora deste protótipo'); },
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (S.menu) { S.menu = null; render(); } return; }
  if (el.dataset.act === 'close-bg') { if (ev.target !== el) return; el.dataset.act = 'close'; }
  if (ACT[el.dataset.act](el.dataset.v, el) !== false) render();
  if (S.sheet) ($('#confirm .btn.ghost') ?? $('.sheet .iconbtn'))?.focus({ preventScroll: true });
});
document.addEventListener('submit', (ev) => { ev.preventDefault(); save(); });
document.addEventListener('change', (ev) => { if (ev.target.id === 'f-freq') $('#l-int').textContent = 'A cada quantos ' + UNITS[ev.target.value]; });
document.addEventListener('keydown', (ev) => { if (ev.key !== 'Escape') return; if (S.confirm) S.confirm = false; else if (S.sheet) S.sheet = null; else if (S.menu) S.menu = null; else return; render(); });
render();

/* ---------- autoteste: abra index.html#selftest (ou #selftest&theme=dark); clica pelo protótipo e confere ---------- */
if (SELFTEST) {
  const out = [], ok = (name, cond) => out.push(`${cond ? 'ok  ' : 'FAIL'} ${name}`), click = (s) => { const el = $(s); if (!el) throw new Error('não achei ' + s); el.click(); };
  const rows = (st) => document.querySelectorAll(`#screen button.row${st ? `[data-state="${st}"]` : '[data-state]'}`).length;
  const folded = () => document.querySelectorAll('details.ended button.row').length; // dentro de “Encerradas”
  const text = (s) => $(s)?.textContent ?? '';
  const endRule = (id) => { click(`[data-act=open][data-v=${id}]`); click('[data-act=end]'); click('[data-act=end-yes]'); };
  const start = S.theme;
  try {
    Object.assign(S, { place: 'A', tab: 'month', sub: 'main', data: 'full', next: false, sheet: null, confirm: false }); data.full = seed(); render();
    ok('A: Mês abre em Lançamentos, com subabas e “Lançar”', !!$('.subtabs') && !!$('.hero') && /Lançar/.test(text('#fab')));
    ok('painel: A escolhida; B e C não escolhidas', /Escolhida/.test(text('[data-act=place][data-v=A]')) && /Não escolhida/.test(text('[data-act=place][data-v=B]')) && /Não escolhida/.test(text('[data-act=place][data-v=C]')));
    click('[data-act=sub][data-v=rep]'); ok('A: subaba Repetições lista 9 na principal + 2 encerradas, sem hero', rows() === 11 && folded() === 2 && !$('.hero'));
    ok('resumo dos próximos 30 dias: A receber / A pagar / Resultado, sem a conta arquivada', /Próximos 30 dias A receber\+R\$ 6\.750,00 A pagar−R\$ 2\.979,80 ResultadoR\$ 3\.770,20/.test(text('#summary').replace(/\s+/g, ' ')) && !/Sobra/.test(text('#screen')));
    ok('lista: conta arquivada aparece como “(arquivada)”', /Banco antigo \(arquivada\)/.test(text('[data-v=r11]')));
    ok('lista: Condomínio mostra atraso', /Atrasado · 20\/11/.test(text('[data-v=r2]')));
    ok('lista: Aluguel mostra próximo 05/12', /Próximo · 05\/12/.test(text('[data-v=r1]')));
    ok('lista: Academia mostra data final', /Até 10\/05\/2027/.test(text('[data-v=r3]')));
    click('[data-act=open][data-v=r3]');
    ok('detalhe da Academia: fatos e “Mudar a partir de” na próxima pendente', text('#sheet-title') === 'Repetição' && /6 efetivados · 6 pendentes/.test(text('#facts')) && $('#f-from').value === '2026-12-10');
    ok('versão atual: ritmo e dia só leitura', !$('#f-freq') && !$('.nextv') && /Para mudar o ritmo, o dia ou a data final, encerre/.test(text('#form')));
    $('#f-amount').value = '0'; click('#form [type=submit]'); ok('edição valida valor', /maior que zero/.test(text('#form')));
    $('#f-amount').value = '129,90'; click('#form [type=submit]'); ok('editar a partir da próxima pendente muda a própria repetição', !S.sheet && /129,90/.test(text('[data-v=r3]')) && rows() === 11);
    click('[data-act=open][data-v=r1]'); $('#f-amount').value = '1.950,00'; $('#f-from').value = '2027-02-05'; click('#form [type=submit]');
    ok('editar a partir de uma data à frente divide em duas', rows() === 12 && /1\.800,00/.test(text('[data-v=r1]')) && /Até 04\/02\/2027/.test(text('[data-v=r1]')) && /1\.950,00/.test(text('[data-v=n1]')) && /Próximo · 05\/02/.test(text('[data-v=n1]')));
    click('[data-act=open][data-v=r2]'); click('[data-act=end]');
    ok('encerrar explica pendentes, efetivados e atrasado', /12 lançamentos pendentes saem da aba Mês/.test(text('#confirm')) && /7 já efetivados continuam/.test(text('#confirm')) && /1 atrasado fica na aba Mês/.test(text('#confirm')));
    click('[data-act=end-no]'); ok('cancelar mantém a repetição aberta', S.sheet === 'r2' && !$('#confirm'));
    click('[data-act=end]'); click('[data-act=end-yes]');
    ok('encerrada com atrasado continua na lista principal, sem “Desfazer”', stateOf(rule('r2')) === 'ended' && folded() === 2 && !$('details.ended [data-v=r2]') && /Atrasado · 20\/11/.test(text('[data-v=r2]')) && /Encerrada · parou em 26\/11\/2026/.test(text('[data-v=r2]')) && !$('.toast') && stats(rule('r2')).pending.length === 0);
    endRule('r4'); ok('encerrada sem atrasado vai para Encerradas', folded() === 3 && !!$('details.ended [data-v=r4]'));
    click('[data-act=sub][data-v=main]'); ok('aba Mês: o atrasado fica, o pendente de hoje sai', /Condomínio/.test(text('#screen')) && !/Faxina/.test(text('#screen')));
    click('[data-act=menu][data-v=t4]'); click('[data-act=see]'); ok('menu do lançamento › Ver repetição', S.sheet === 'r5');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); ok('Escape fecha', !S.sheet);
    click('[data-act=sub][data-v=rep]'); click('[data-act=open][data-v=r10]');
    ok('encerrada: só leitura, sem “Repetir de novo” na versão atual', text('#sheet-title') === 'Curso de inglês' && !$('#form') && !$('[data-act=again]') && /parou em 03\/10\/2026/.test(text('#facts')));
    click('[data-act=ver][data-v=next]'); click('[data-act=open][data-v=r10]');
    ok('próxima versão: “Repetir de novo” sinalizado', !!$('.nextv [data-act=again]') && /Próxima versão/.test(text('.nextv')));
    click('[data-act=again]'); ok('repetir de novo cria outra a partir de 03/12', rules().at(-1).start_date === '2026-12-03' && rows() === 13);
    click('[data-act=open][data-v=r5]'); ok('próxima versão: ritmo e dia editáveis, sinalizados', !!$('.nextv #f-freq') && !!$('.nextv #f-int') && !!$('.nextv #f-day'));
    $('#f-day').value = '2026-12-20'; click('#form [type=submit]');
    ok('mudar o dia: a antiga encerra e a nova segue no dia 20', stateOf(rule('r5')) === 'ended' && rhythm(rules().at(-1)) === 'Todo mês, dia 20' && /Próximo · 20\/12/.test(text(`[data-v=${rules().at(-1).id}]`)));
    click('[data-act=ver][data-v=now]');
    click('[data-act=place][data-v=B]'); ok('B (não escolhida): abre em Mais com a entrada', text('#title') === 'Mais' && !!$('#more-entry') && !$('.subtabs') && !!$('#hist'));
    click('#more-entry'); ok('B: tela Repetições com voltar', text('#title') === 'Repetições' && rows() === 14);
    click('.hdr [data-act=sub]'); ok('B: voltar retorna a Mais', text('#title') === 'Mais');
    click('[data-act=place][data-v=C]'); ok('C (não escolhida): Contas com subaba Repetições', text('#title') === 'Contas' && text('.subtabs [aria-pressed=true]') === 'Repetições' && rows() === 14 && !!$('#hist'));
    click('[data-act=tab][data-v=categories]'); ok('barra inferior segue com 4 abas, sem Repetições', document.querySelectorAll('.tabbar button').length === 4 && !/Repeti/.test(text('.tabbar')));
    click('[data-act=place][data-v=A]'); click('[data-act=data][data-v=empty]');
    ok('vazio: uma única ação, “Nova repetição”', !!$('#empty') && rows() === 0 && !$('#hist') && !$('#empty button') && document.querySelectorAll('#phone [data-act=new]').length === 1 && /Nova repetição/.test(text('#fab')));
    click('#fab'); ok('nova repetição abre o formulário de lançamento já repetindo', text('#sheet-title') === 'Novo lançamento' && $('#f-freq').value === 'monthly');
    $('#f-amount').value = '1.234,56'; $('#f-desc').value = 'Plano de saúde'; click('#form [type=submit]');
    ok('nova repetição aparece na lista', rows() === 1 && /1\.234,56/.test(text('#screen')) && /Próximo · 27\/11/.test(text('#screen')));
    const bg = () => getComputedStyle($('#phone')).backgroundColor, before = bg(), other = start === 'dark' ? 'light' : 'dark';
    click(`[data-act=theme][data-v=${other}]`); ok(`tema: de ${start} para ${other} troca os tokens`, document.documentElement.dataset.theme === other && bg() !== before);
  } catch (e) { out.push('FAIL exceção: ' + e.message); }
  const fails = out.filter((l) => l.startsWith('FAIL')).length;
  $('#selftest-out').textContent = `SELFTEST ${fails ? 'FALHOU' : 'OK'} · ${out.length - fails}/${out.length} · tema inicial ${start}\n` + out.join('\n');
}
